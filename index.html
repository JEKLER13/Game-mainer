<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахтёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;800&display=swap">
<style>
:root{--bg:#E9E4DA;--panel:#F8F5EE;--text:#2A2620;--muted:#7B7467;--accent:#C9702B;--accent-text:#fff;--stone:#8D949E;--line:#D6CFC1;--good:#2E8B57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B212B;--panel:#252D3A;--text:#EEE9DF;--muted:#9AA3B2;--accent:#E8924A;--accent-text:#1B1208;--stone:#6B7482;--line:#34404F;--good:#5CD08B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B212B;--panel:#252D3A;--text:#EEE9DF;--muted:#9AA3B2;--accent:#E8924A;--accent-text:#1B1208;--stone:#6B7482;--line:#34404F;--good:#5CD08B;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 16px 6px}
.money{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bag{text-align:right;font-weight:800;font-size:17px}
.bag small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.meter{width:96px;height:6px;border-radius:3px;background:var(--line);margin-top:4px;margin-left:auto;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.lv{display:flex;align-items:center;gap:8px;padding:0 16px 6px;font-weight:800;font-size:13px}
.xp{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;background:var(--good);width:0}
main{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px}
.view[hidden]{display:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
.zone{font-size:13px;color:var(--muted);font-weight:500}
.orename{font-size:18px;font-weight:800}
.orename span{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
.block{position:relative;width:min(60vw,240px);aspect-ratio:1;border:0;padding:0;border-radius:20px;cursor:pointer;background:radial-gradient(circle at 25% 30%,var(--ore) 0 9%,transparent 10%),radial-gradient(circle at 72% 24%,var(--ore) 0 7%,transparent 8%),radial-gradient(circle at 62% 70%,var(--ore) 0 11%,transparent 12%),radial-gradient(circle at 28% 76%,var(--ore) 0 6%,transparent 7%),var(--stone);box-shadow:inset 0 -12px 0 rgba(0,0,0,.2),inset 0 8px 0 rgba(255,255,255,.14),0 6px 0 rgba(0,0,0,.18)}
.block::after{content:"";position:absolute;inset:0;border-radius:20px;background:repeating-linear-gradient(115deg,transparent 0 16px,rgba(0,0,0,.45) 16px 18px);opacity:var(--crack,0);pointer-events:none}
.block.hit{animation:hit .12s}
@keyframes hit{40%{transform:translate(3px,2px) scale(.97)}70%{transform:translate(-3px,0) scale(.98)}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hp{width:min(60vw,240px);height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.chip{background:var(--panel);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-weight:800}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.chip.zero{opacity:.45}
.sell{width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-size:17px;font-weight:800;background:var(--accent);color:var(--accent-text);cursor:pointer}
.sell:disabled{opacity:.4}
.fl{position:fixed;font-weight:800;font-size:20px;color:var(--text);pointer-events:none;animation:fl .7s ease-out forwards;text-shadow:0 1px 0 var(--bg)}
@keyframes fl{to{transform:translateY(-56px);opacity:0}}
.card{background:var(--panel);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.card.on{outline:2px solid var(--good)}
.card .ico{font-size:32px;width:44px;text-align:center}
.card .info{flex:1;min-width:0}
.card b{display:block;font-size:16px}
.card small{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0 2px 12px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;font-size:14px;background:var(--accent);color:var(--accent-text);cursor:pointer;white-space:nowrap}
.btn:disabled{background:var(--line);color:var(--muted)}
.btn.eq{background:var(--good);color:#fff}
nav{display:flex;gap:4px;padding:8px 8px 12px;background:var(--panel)}
nav button{flex:1;border:0;border-radius:14px;padding:11px 2px;font:inherit;font-weight:800;font-size:13px;background:transparent;color:var(--muted);cursor:pointer}
nav button.on{background:var(--bg);color:var(--text)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.block.hit,.fl{animation:none}#toast{transition:none}}
.ib{border:0;background:var(--panel);border-radius:10px;padding:4px 8px;font-size:15px;cursor:pointer;position:relative}
.ib.dot::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.5)}
.modal[hidden]{display:none}
.modal .panel{width:100%;max-width:360px;background:var(--panel);border-radius:24px;padding:22px 18px;text-align:center}
.modal h2{margin:0 0 8px;font-size:22px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.day{background:var(--bg);border-radius:12px;padding:8px 2px;font-size:13px}
.day b{display:block;font-size:14px}.day small{color:var(--muted)}
.day.done{opacity:.55}.day.cur{outline:2px solid var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="money" id="money">$0</div>
    <div class="bag"><small>Рюкзак</small><span id="bagtxt">0 / 14</span><div class="meter"><i id="bagbar"></i></div></div>
  </div>
  <div class="lv"><span id="lvtxt">Ур. 1</span><div class="xp"><i id="xpbar"></i></div><span id="mult"></span><button class="ib" id="gift" aria-label="Ежедневная награда">🎁</button><button class="ib" id="snd" aria-label="Звук">🔊</button></div>
  <main>
    <section class="view" id="v-mine">
      <div class="stage">
        <div class="zone" id="zone"></div>
        <div class="orename" id="orename"></div>
        <button class="block" id="block" aria-label="Ломать блок"></button>
        <div class="hp"><i id="hp"></i></div>
        <div class="chips" id="chips"></div>
        <button class="sell" id="sell">Продать всё</button>
      </div>
    </section>
    <section class="view" id="v-picks" hidden></section>
    <section class="view" id="v-ups" hidden></section>
    <section class="view" id="v-pets" hidden></section>
    <section class="view" id="v-world" hidden></section>
  </main>
  <nav>
    <button class="on" data-tab="mine">Шахта</button>
    <button data-tab="picks">Кирки</button>
    <button data-tab="ups">Прокачка</button>
    <button data-tab="pets">Питомцы</button>
    <button data-tab="world">Мир</button>
  </nav>
</div>
<div class="modal" id="modal" hidden><div class="panel"><h2 id="mt"></h2><div id="mb"></div><button class="sell" id="mbtn">Ок</button></div></div>
<div id="toast"></div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
  function buzz(t){ try { if (tg && tg.HapticFeedback) { if (t==='ok') tg.HapticFeedback.notificationOccurred('success'); else tg.HapticFeedback.impactOccurred('light'); } } catch(e){} }

  var AC = null;
  function tone(f, d, type, v, delay){
    if (!S.snd) return;
    try {
      if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
      if (AC.state === 'suspended') AC.resume();
      var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
    } catch(e){}
  }
  var SFX = {
    hit:function(){ tone(180, 0.06, 'square', 0.04); },
    crit:function(){ tone(300, 0.08, 'sawtooth', 0.06); tone(450, 0.12, 'sawtooth', 0.06, 0.06); },
    brk:function(){ tone(220, 0.08, 'triangle', 0.08); tone(330, 0.1, 'triangle', 0.08, 0.07); },
    sell:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f, 0.12, 'triangle', 0.07, i * 0.07); }); },
    buy:function(){ tone(392, 0.1, 'square', 0.05); tone(587, 0.16, 'square', 0.05, 0.09); },
    lvl:function(){ [392,494,587,784].forEach(function(f,i){ tone(f, 0.14, 'square', 0.05, i * 0.09); }); },
    err:function(){ tone(110, 0.15, 'sawtooth', 0.05); }
  };

  var ORES = [
    {n:'Камень',e:'🪨',v:1,w:60,hp:8,c:'#A9B0BA'},{n:'Уголь',e:'⚫',v:3,w:25,hp:14,c:'#2F343C'},
    {n:'Железо',e:'🔩',v:9,w:12,hp:26,c:'#D1A98A'},{n:'Золото',e:'🪙',v:30,w:6,hp:45,c:'#F2C230'},
    {n:'Аметист',e:'🔮',v:110,w:2.5,hp:80,c:'#A06BE0'},{n:'Алмаз',e:'💎',v:400,w:1,hp:140,c:'#4FD6FF'}
  ];
  var ZONES = [
    {n:'Карьер',e:'⛰️',hp:1,v:1,price:0},{n:'Глубокая пещера',e:'🕳️',hp:4,v:3,price:2500},
    {n:'Лавовые недра',e:'🌋',hp:16,v:10,price:150000},{n:'Кристальная бездна',e:'💠',hp:64,v:40,price:8e6}
  ];
  var PICKS = [
    {n:'Деревянная',e:'🪵',dmg:1,luck:0,price:0},{n:'Каменная',e:'🪨',dmg:2.5,luck:0,price:80},
    {n:'Железная',e:'⛏️',dmg:6,luck:1,price:700},{n:'Золотая',e:'🟡',dmg:15,luck:2,price:7000},
    {n:'Алмазная',e:'💠',dmg:40,luck:3,price:80000},{n:'Изумрудная',e:'🟢',dmg:110,luck:5,price:900000},
    {n:'Космическая',e:'🌠',dmg:320,luck:8,price:12e6},{n:'Мифриловая',e:'🔷',dmg:900,luck:11,price:2e8},
    {n:'Небесная',e:'☄️',dmg:3000,luck:15,price:3e9}
  ];
  var PETS = [
    {n:'Крот',e:'🐹',k:0.4,price:3000},{n:'Бобр',e:'🦫',k:1,price:60000},
    {n:'Дракончик',e:'🐲',k:2.5,price:2e6},{n:'Голем',e:'🗿',k:7,price:1e8}
  ];
  var UPS = [
    {id:'pow',n:'Сила',d:'+25% к урону',base:40,g:1.7},
    {id:'bag',n:'Рюкзак',d:'+6 мест',base:60,g:1.8},
    {id:'luck',n:'Удача',d:'Редкие руды чаще',base:120,g:1.9},
    {id:'sell',n:'Цена продажи',d:'+15% к цене',base:200,g:2},
    {id:'crit',n:'Критический удар',d:'x3 урона',base:150,g:1.9,max:20}
  ];
  var REB_LVL = 12;

  var S = {money:0,inv:[0,0,0,0,0,0],owned:[0],eq:0,up:{pow:0,bag:0,luck:0,sell:0,crit:0},zone:0,zmax:0,lvl:1,xp:0,reb:0,pets:[],pet:-1,snd:true,last:0,streak:0,claimed:''};
  try {
    var sv = JSON.parse(localStorage.getItem('miner-save2') || 'null');
    if (sv) { var up = Object.assign({}, S.up, sv.up); Object.assign(S, sv); S.up = up; }
  } catch(e){}
  function save(){ S.last = Date.now(); try { localStorage.setItem('miner-save2', JSON.stringify(S)); } catch(e){} }

  function fmt(n){
    if (n < 1000) return String(Math.floor(n));
    var u = ['K','M','B','T','Qa','Qi'], i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : String(Math.floor(n))) + u[i];
  }
  function cap(){ return 14 + 6 * S.up.bag; }
  function used(){ return S.inv.reduce(function(a,b){ return a + b; }, 0); }
  function need(l){ return Math.floor(30 * Math.pow(1.5, l - 1)); }
  function rebM(){ return 1 + 0.5 * S.reb; }
  function dmg(){ return PICKS[S.eq].dmg * (1 + 0.25 * S.up.pow) * (1 + 0.04 * (S.lvl - 1)) * rebM(); }
  function luck(){ return PICKS[S.eq].luck + S.up.luck; }
  function sellM(){ return (1 + 0.15 * S.up.sell) * rebM(); }
  function critP(){ return 0.05 + 0.03 * S.up.crit; }
  function value(i){ return ORES[i].v * ZONES[S.zone].v * sellM(); }
  function upCost(u){ return Math.floor(u.base * Math.pow(u.g, S.up[u.id])); }

  function rollOre(){
    var L = luck(), z = S.zone;
    var ws = ORES.map(function(o,i){ return o.w * (1 + 0.2 * L * i) * (1 + 0.6 * z * i); });
    var r = Math.random() * ws.reduce(function(a,b){ return a + b; }, 0);
    for (var i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; }
    return 0;
  }
  var blk;
  function newBlock(){ var i = rollOre(), h = ORES[i].hp * ZONES[S.zone].hp; blk = {i:i, hp:h, max:h}; }
  newBlock();

  var $ = function(id){ return document.getElementById(id); };
  var blockEl = $('block'), toastT, rbAsk = false, rbT;
  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 1500); }

  function drawBlock(){
    var o = ORES[blk.i], r = blk.hp / blk.max;
    blockEl.style.setProperty('--ore', o.c);
    blockEl.style.setProperty('--crack', String(1 - r));
    $('hp').style.transform = 'scaleX(' + Math.max(0, r) + ')';
    $('orename').innerHTML = o.e + ' ' + o.n + '<span>$' + fmt(value(blk.i)) + '</span>';
    $('zone').textContent = ZONES[S.zone].e + ' ' + ZONES[S.zone].n;
  }
  function drawHud(){
    $('money').textContent = '$' + fmt(S.money);
    var u = used(), c = cap();
    $('bagtxt').textContent = u + ' / ' + c;
    $('bagbar').style.width = Math.min(100, u / c * 100) + '%';
    $('sell').disabled = u === 0;
    $('lvtxt').textContent = 'Ур. ' + S.lvl;
    $('snd').textContent = S.snd ? '🔊' : '🔇';
    $('gift').classList.toggle('dot', dailyCanClaim());
    $('xpbar').style.width = Math.min(100, S.xp / need(S.lvl) * 100) + '%';
    $('mult').textContent = S.reb ? '×' + rebM().toFixed(1) : '';
    $('chips').innerHTML = ORES.map(function(o,i){
      return '<div class="chip' + (S.inv[i] ? '' : ' zero') + '"><span style="font-size:22px">' + o.e + '</span><div>' + S.inv[i] + '<small>$' + fmt(value(i)) + '</small></div></div>';
    }).join('');
  }
  function drawPicks(){
    $('v-picks').innerHTML = '<p class="note">Урон за тап: ' + fmt(dmg()) + '</p>' + PICKS.map(function(p,i){
      var own = S.owned.indexOf(i) >= 0, b;
      if (S.eq === i) b = '<button class="btn eq" disabled>Надета</button>';
      else if (own) b = '<button class="btn" data-eq="' + i + '">Надеть</button>';
      else b = '<button class="btn" data-buy="' + i + '"' + (S.money < p.price ? ' disabled' : '') + '>$' + fmt(p.price) + '</button>';
      return '<div class="card' + (S.eq === i ? ' on' : '') + '"><div class="ico">' + p.e + '</div><div class="info"><b>' + p.n + '</b><small>Урон ' + fmt(p.dmg) + ' · Удача +' + p.luck + '</small></div>' + b + '</div>';
    }).join('');
  }
  function drawUps(){
    $('v-ups').innerHTML = UPS.map(function(u){
      var l = S.up[u.id], c = upCost(u), maxed = u.max && l >= u.max;
      var d = u.id === 'crit' ? 'Шанс ' + Math.round(critP() * 100) + '%, ' + u.d : u.d;
      return '<div class="card"><div class="info"><b>' + u.n + ' · ур. ' + l + '</b><small>' + d + '</small></div><button class="btn" data-up="' + u.id + '"' + (maxed || S.money < c ? ' disabled' : '') + '>' + (maxed ? 'Макс' : '$' + fmt(c)) + '</button></div>';
    }).join('');
  }
  function drawPets(){
    $('v-pets').innerHTML = '<p class="note">Питомец сам бьёт блок раз в секунду, пока в рюкзаке есть место.</p>' + PETS.map(function(p,i){
      var own = S.pets.indexOf(i) >= 0, b;
      if (S.pet === i) b = '<button class="btn eq" disabled>Работает</button>';
      else if (own) b = '<button class="btn" data-peq="' + i + '">Позвать</button>';
      else b = '<button class="btn" data-pbuy="' + i + '"' + (S.money < p.price ? ' disabled' : '') + '>$' + fmt(p.price) + '</button>';
      return '<div class="card' + (S.pet === i ? ' on' : '') + '"><div class="ico">' + p.e + '</div><div class="info"><b>' + p.n + '</b><small>' + p.k + '× урона в секунду</small></div>' + b + '</div>';
    }).join('');
  }
  function drawWorld(){
    var h = '<p class="note">Глубже руда дороже, но блоки твёрже.</p>' + ZONES.map(function(z,i){
      var b;
      if (i <= S.zmax) b = S.zone === i ? '<button class="btn eq" disabled>Здесь</button>' : '<button class="btn" data-zone="' + i + '">Войти</button>';
      else b = '<button class="btn" data-zbuy="' + i + '"' + (i > S.zmax + 1 || S.money < z.price ? ' disabled' : '') + '>$' + fmt(z.price) + '</button>';
      return '<div class="card' + (S.zone === i ? ' on' : '') + '"><div class="ico">' + z.e + '</div><div class="info"><b>' + z.n + '</b><small>Руда ×' + z.v + ' · Блоки ×' + z.hp + '</small></div>' + b + '</div>';
    }).join('');
    h += '<div class="card"><div class="ico">🔁</div><div class="info"><b>Перерождение · ' + S.reb + '</b><small>Нужен уровень ' + REB_LVL + ' (сейчас ' + S.lvl + '). Сбросит деньги, кирки, прокачку, зоны и уровень. Навсегда даст урон и цену ×' + (1 + 0.5 * (S.reb + 1)).toFixed(1) + '. Питомцы останутся.</small></div><button class="btn" data-reb="1"' + (S.lvl < REB_LVL ? ' disabled' : '') + '>' + (rbAsk ? 'Точно?' : 'Начать') + '</button></div>';
    $('v-world').innerHTML = h;
  }
  function drawAll(){ drawHud(); drawBlock(); drawPicks(); drawUps(); drawPets(); drawWorld(); }

  function floatText(x, y, t){
    var f = document.createElement('div');
    f.className = 'fl'; f.textContent = t; f.style.left = (x - 12) + 'px'; f.style.top = (y - 30) + 'px';
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, 720);
  }

  function hit(d, pt, crit){
    blk.hp -= d;
    if (pt) floatText(pt.x, pt.y, (crit ? 'КРИТ ' : '') + '-' + fmt(d));
    blockEl.classList.remove('hit'); void blockEl.offsetWidth; blockEl.classList.add('hit');
    if (blk.hp <= 0) {
      S.inv[blk.i]++;
      if (pt) { floatText(pt.x, pt.y - 26, ORES[blk.i].e); SFX.brk(); }
      S.xp += (blk.i + 1) * (S.zone + 1) * 2;
      while (S.xp >= need(S.lvl)) { S.xp -= need(S.lvl); S.lvl++; toast('Новый уровень: ' + S.lvl); buzz('ok'); SFX.lvl(); }
      newBlock(); drawHud(); save();
    }
    drawBlock();
  }

  blockEl.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if (used() >= cap()) { toast('Рюкзак полон: продай добычу'); SFX.err(); return; }
    var c = Math.random() < critP(), d = dmg() * (c ? 3 : 1);
    buzz('tap'); (c ? SFX.crit : SFX.hit)();
    hit(d, {x:e.clientX, y:e.clientY}, c);
  });

  setInterval(function(){
    if (S.pet < 0 || used() >= cap()) return;
    var r = blockEl.getBoundingClientRect();
    hit(dmg() * PETS[S.pet].k, r.width ? {x:r.left + r.width / 2, y:r.top + r.height / 2} : null, false);
  }, 1000);

  $('sell').addEventListener('click', function(){
    var t = 0;
    for (var i = 0; i < ORES.length; i++) { t += S.inv[i] * value(i); S.inv[i] = 0; }
    t = Math.floor(t); S.money += t;
    toast('Продано на $' + fmt(t)); buzz('ok'); SFX.sell(); drawAll(); save();
  });

  var TABS = ['mine','picks','ups','pets','world'];
  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset, m0 = S.money;
    if (d.tab) {
      TABS.forEach(function(t){ $('v-' + t).hidden = t !== d.tab; });
      document.querySelectorAll('nav button').forEach(function(n){ n.classList.toggle('on', n === b); });
      return;
    }
    if (d.buy !== undefined) { var p = PICKS[+d.buy]; if (S.money >= p.price) { S.money -= p.price; S.owned.push(+d.buy); S.eq = +d.buy; toast(p.n + ' кирка куплена'); buzz('ok'); } }
    else if (d.eq !== undefined) S.eq = +d.eq;
    else if (d.up !== undefined) {
      var u = UPS.filter(function(x){ return x.id === d.up; })[0], c = upCost(u);
      if (S.money >= c && !(u.max && S.up[u.id] >= u.max)) { S.money -= c; S.up[u.id]++; toast(u.n + ': уровень ' + S.up[u.id]); buzz('ok'); }
    }
    else if (d.pbuy !== undefined) { var q = PETS[+d.pbuy]; if (S.money >= q.price) { S.money -= q.price; S.pets.push(+d.pbuy); S.pet = +d.pbuy; toast(q.n + ' теперь с тобой'); buzz('ok'); } }
    else if (d.peq !== undefined) S.pet = +d.peq;
    else if (d.zone !== undefined) { S.zone = +d.zone; newBlock(); }
    else if (d.zbuy !== undefined) { var z = ZONES[+d.zbuy]; if (S.money >= z.price && +d.zbuy === S.zmax + 1) { S.money -= z.price; S.zmax++; S.zone = S.zmax; newBlock(); toast('Открыто: ' + z.n); buzz('ok'); } }
    else if (d.reb !== undefined) {
      if (S.lvl < REB_LVL) return;
      if (!rbAsk) { rbAsk = true; clearTimeout(rbT); rbT = setTimeout(function(){ rbAsk = false; drawWorld(); }, 4000); drawWorld(); return; }
      rbAsk = false;
      S.reb++; S.money = 0; S.inv = [0,0,0,0,0,0]; S.owned = [0]; S.eq = 0;
      S.up = {pow:0,bag:0,luck:0,sell:0,crit:0}; S.zone = 0; S.zmax = 0; S.lvl = 1; S.xp = 0;
      newBlock(); toast('Перерождение! Бонус ×' + rebM().toFixed(1)); buzz('ok');
    }
    else return;
    if (S.money < m0) SFX.buy();
    drawAll(); save();
  });

  var modalCb = null;
  function modal(title, html, btn, cb){
    $('mt').textContent = title; $('mb').innerHTML = html; $('mbtn').textContent = btn || 'Ок';
    modalCb = cb || null; $('modal').hidden = false;
  }
  $('mbtn').addEventListener('click', function(){ $('modal').hidden = true; var f = modalCb; modalCb = null; if (f) f(); });
  $('snd').addEventListener('click', function(){ S.snd = !S.snd; save(); drawHud(); SFX.buy(); });

  function ymd(d){ var m = d.getMonth() + 1, k = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (k < 10 ? '0' : '') + k; }
  function dayDiff(a, b){ return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
  var DAILY = [1,2,3,4,5,6,12];
  function dailyUnit(){ return Math.max(300, Math.floor(dmg() * 120)); }
  function dailyCanClaim(){ return S.claimed !== ymd(new Date()); }
  function showDaily(){
    var t = ymd(new Date());
    if (S.claimed && dayDiff(S.claimed, t) > 1) S.streak = 0;
    var can = S.claimed !== t, cur = S.streak % 7, doneN = can ? cur : (cur || 7);
    var h = '<p class="note">Заходи каждый день: награда растёт, а на 7-й день она самая большая.</p><div class="days">' + DAILY.map(function(k,i){
      return '<div class="day' + (i < doneN ? ' done' : '') + (can && i === cur ? ' cur' : '') + '"><small>День ' + (i + 1) + '</small><b>' + (i < doneN ? '✓' : '$' + fmt(k * dailyUnit())) + '</b></div>';
    }).join('') + '</div>';
    modal('Ежедневная награда', h, can ? 'Забрать $' + fmt(DAILY[cur] * dailyUnit()) : 'Закрыть', can ? function(){
      var r = DAILY[cur] * dailyUnit();
      S.money += r; S.streak++; S.claimed = t;
      toast('Награда: $' + fmt(r)); SFX.sell(); drawAll(); save();
    } : null);
  }
  $('gift').addEventListener('click', showDaily);

  function offline(){
    var sec = S.last ? Math.min((Date.now() - S.last) / 1000, 7200) : 0;
    if (S.pet < 0 || sec < 60) return false;
    var L = luck(), z = S.zone, sw = 0, hp = 0, val = 0;
    ORES.forEach(function(o,i){ var w = o.w * (1 + 0.2 * L * i) * (1 + 0.6 * z * i); sw += w; hp += w * o.hp; val += w * value(i); });
    hp = hp / sw * ZONES[z].hp; val /= sw;
    var gain = Math.floor(sec * dmg() * PETS[S.pet].k / hp * val * 0.5);
    if (gain < 1) return false;
    modal('Пока тебя не было', '<p style="font-size:44px;margin:4px 0">' + PETS[S.pet].e + '</p><p class="note">' + PETS[S.pet].n + ' копал ' + Math.round(sec / 60) + ' мин. и продал добычу за половину цены (не больше 2 часов).</p><p style="font-weight:800;font-size:26px;margin:0 0 16px">$' + fmt(gain) + '</p>', 'Забрать', function(){
      S.money += gain; SFX.sell(); drawAll(); save(); autoDaily();
    });
    return true;
  }
  function autoDaily(){ if (dailyCanClaim()) showDaily(); }
  function startup(){ if (!$('modal').hidden) return; if (!offline()) autoDaily(); }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) save(); else startup(); });

  drawAll(); startup();
})();
</script>
</body>
</html>
